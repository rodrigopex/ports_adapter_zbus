CONFIG_ZEPHLETS=y
CONFIG_ZEPHLET_TICK=y
CONFIG_ZEPHLET_UI=y
CONFIG_ZEPHLET_TAMPERING=y
CONFIG_ZEPHLET_TYPELAB=y

# `zlet typelab_bench config ...` / `get_config` — exercises every
# nanopb scalar type the shell frontend supports.
CONFIG_ZEPHLETS_SHELL=y
# Each RPC takes its request as one SHELL_OPT_ARG_RAW argument. Wildcard
# expansion rewrites the command buffer before the handler runs, which
# would corrupt that argument silently; the frontend BUILD_ASSERTs on it.
CONFIG_SHELL_WILDCARD=n
# typelab_config carries uint64/int64/fixed64/sfixed64. Without full
# integral conversion cbprintf drops 64-bit conversions and the printed
# value is wrong rather than merely imprecise.
CONFIG_CBPRINTF_FULL_INTEGRAL=y
CONFIG_CBPRINTF_COMPLETE=y
# Caps the whole command line, not just the message. Text format names
# every field it sets, so it is more verbose than the positional form it
# replaced: one line carrying all 18 typelab fields runs to roughly 460
# characters, past the 256-byte default.
CONFIG_SHELL_CMD_BUFF_SIZE=1024
# A *pasted* (or piped) message arrives faster than the shell drains it,
# and the serial RX ring buffer defaults to 64 bytes -- a long line is
# silently truncated mid-parse. Typing is slow enough not to notice.
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=1024

CONFIG_LOG=y
CONFIG_ZEPHLET_TICK_LOG_LEVEL_DBG=y
CONFIG_ZEPHLET_UI_LOG_LEVEL_DBG=y
CONFIG_ZEPHLET_TAMPERING_LOG_LEVEL_DBG=y
CONFIG_ZEPHLET_TYPELAB_LOG_LEVEL_DBG=y

CONFIG_ASSERT=y

CONFIG_SENSOR=y
CONFIG_SHELL=y

CONFIG_PWM=y
CONFIG_PWM_RPI_PICO=y

CONFIG_ASSERT=y

CONFIG_HEAP_MEM_POOL_SIZE=32768

CONFIG_GPIO_SHELL=y

CONFIG_MAIN_STACK_SIZE=5200
CONFIG_SHELL_STACK_SIZE=5200

# CONFIG_FLASH=y
