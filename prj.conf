CONFIG_ZEPHLETS=y
CONFIG_ZEPHLET_TICK=y
CONFIG_ZEPHLET_UI=y
CONFIG_ZEPHLET_TAMPERING=y
CONFIG_ZEPHLET_TYPELAB=y

# `zlet typelab_bench config ...` / `get_config` — exercises every
# nanopb scalar type the shell frontend supports.
CONFIG_ZEPHLETS_SHELL=y
# typelab_config.f_float/f_double need these or the shell prints the
# literal "%g" instead of the value (cbprintf drops float conversions
# without them — see modules/lib/zephlet/docs/plans/shell-frontend.md).
CONFIG_CBPRINTF_COMPLETE=y
CONFIG_CBPRINTF_FP_SUPPORT=y
# Default (20) counts every token including "zlet"/the instance name/
# the rpc name itself, so `zlet typelab_bench config <18 args>` (21
# tokens total) overflows it with "Too many arguments in the command."
CONFIG_SHELL_ARGC_MAX=32

CONFIG_LOG=y
CONFIG_ZEPHLET_TICK_LOG_LEVEL_DBG=y
CONFIG_ZEPHLET_UI_LOG_LEVEL_DBG=y
CONFIG_ZEPHLET_TAMPERING_LOG_LEVEL_DBG=y
CONFIG_ZEPHLET_TYPELAB_LOG_LEVEL_DBG=y

CONFIG_ASSERT=y

CONFIG_SENSOR=y
CONFIG_SHELL=y

CONFIG_PWM=y
CONFIG_PWM_RPI_PICO=y

CONFIG_ASSERT=y

CONFIG_HEAP_MEM_POOL_SIZE=32768

CONFIG_GPIO_SHELL=y

CONFIG_MAIN_STACK_SIZE=5200
CONFIG_SHELL_STACK_SIZE=5200

# CONFIG_FLASH=y
# CONFIG_FLASH_MAP=y
# CONFIG_FILE_SYSTEM=y
# CONFIG_FILE_SYSTEM_LITTLEFS=y
