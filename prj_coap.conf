CONFIG_ZEPHLETS_COAP=y

# Native simulator networking. Offloaded sockets forward Zephyr socket calls
# to the host BSD stack so the CoAP server binds a real host socket on
# 0.0.0.0:5683 — reachable from anything routed to the container's network.
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_NET_IPV6_DAD=n

CONFIG_COAP=y
CONFIG_COAP_SERVER=y
CONFIG_COAP_URI_WILDCARD=y

CONFIG_MAIN_STACK_SIZE=2048
