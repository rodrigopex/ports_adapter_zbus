CONFIG_ZEPHLETS=y
CONFIG_ZEPHLET_TICK=y

CONFIG_GPIO=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y

# Strip noise from the measured window.
CONFIG_LOG=n
CONFIG_ASSERT=n

# Optimise for size; matches what a production build would use.
CONFIG_SIZE_OPTIMIZATIONS=y

# Required: zbus + async listener (used by tick's events helper, not
# measured here but must exist because production tick links against it).
CONFIG_ZBUS=y
CONFIG_ZBUS_ASYNC_LISTENER=y

# Run main as a regular thread so we can use k_sleep before printing.
CONFIG_MAIN_STACK_SIZE=4096
