CONFIG_ZEPHLETS_COAP=y
CONFIG_COAP_SERVER_WELL_KNOWN_CORE=y

CONFIG_COAP=y
CONFIG_COAP_SERVER=y
CONFIG_COAP_URI_WILDCARD=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_COAP_SERVER_SHELL=y

# The CoAP server poll loop creates an eventfd as its control socket, and the
# DNS socket-service needs one too; the default cap of 1 starves them (ENOMEM).
CONFIG_ZVFS_EVENTFD_MAX=4

CONFIG_MAIN_STACK_SIZE=2048
